[package]
name = "openrust"
version = "0.1.0"
edition = "2021"
description = "OpenRust - An AI-powered terminal coding assistant, written in Rust"
authors = ["OpenRust Contributors"]
license = "MIT"
repository = "https://github.com/abderrazzakchabab/openrust"
keywords = ["ai", "terminal", "coding", "assistant", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "openrust"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for AI APIs
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Config file management
dirs = "6"
toml = "0.8"

# Syntax highlighting
syntect = "5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
which = "7"
open = "5"
futures = "0.3"
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
